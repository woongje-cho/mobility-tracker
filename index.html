<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="모빌리티 전략 원장">
<meta property="og:description" content="회사가 약속한 날짜와 실제로 도착한 날짜를 공개 데이터로 추적합니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 26%27%3E%3Crect width=%2726%27 height=%2726%27 rx=%276%27 fill=%27%232a3034%27/%3E%3Crect x=%2711.5%27 y=%273%27 width=%273%27 height=%275%27 rx=%271%27 fill=%27%23f2b90f%27/%3E%3Crect x=%2711.5%27 y=%2710.5%27 width=%273%27 height=%275%27 rx=%271%27 fill=%27%23f2b90f%27/%3E%3Crect x=%2711.5%27 y=%2718%27 width=%273%27 height=%275%27 rx=%271%27 fill=%27%23f2b90f%27/%3E%3C/svg%3E">
<title>Mobility Ledger · 모빌리티 전략 원장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="로보택시, 휴머노이드, SDV 기업들이 공개적으로 약속한 것과 실제로 일어난 일을 공개 데이터로 추적하는 개인 원장.">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Same visual family as woongje-cho.github.io: cream dotted ground, 3px ink strokes, hard offset shadows,
   Clash Display headlines, tilted stickers and a yellow tape. One bold element per screen. */
:root{
  --cream:#fff8ec; --paper:#ffffff; --ink:#1a1a1a; --soft:#555049; --line:#1a1a1a;
  --orange:#ff5a1f; --yellow:#ffd23f; --cobalt:#2546f0; --mint:#9be8c9; --pink:#ffb3c7; --sand:#f3ead9;
  --stroke:3px solid var(--ink); --pop:5px 5px 0 var(--ink); --pop-s:3px 3px 0 var(--ink);
  --display:"Clash Display","Pretendard Variable",Pretendard,"Gothic A1",system-ui,sans-serif;
  --body:"Pretendard Variable",Pretendard,"Gothic A1","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --track:#2b2b2b; --muted:var(--soft);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --cream:#17140f; --paper:#221e18; --ink:#f6efe1; --soft:#b8ad9b; --sand:#2c271f;
  --track:#0f0d0a; color-scheme:dark}}
:root[data-theme="dark"]{ --cream:#17140f; --paper:#221e18; --ink:#f6efe1; --soft:#b8ad9b; --sand:#2c271f; --track:#0f0d0a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 86px)}
body{margin:0;background-color:var(--cream);background-image:radial-gradient(color-mix(in srgb,var(--ink) 13%,transparent) 1px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font:16px/1.7 var(--body);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--cream)}
a{color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:6px}
main{overflow-x:clip}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.cd{font-family:var(--display);font-weight:700;letter-spacing:-.025em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.checker{height:8px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 16px),var(--cream)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--cream);border-bottom:var(--stroke)}
header.site .wrap{display:flex;align-items:center;gap:16px;min-height:66px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto}
.logo .pill{background:var(--ink);color:var(--yellow);border-radius:12px;padding:7px 12px;font:700 15px/1 var(--display);box-shadow:3px 3px 0 color-mix(in srgb,var(--ink) 45%,transparent);transform:rotate(-3deg)}
.logo .t{font:700 16px/1.1 var(--display)}
.logo .t small{display:block;font:600 11.5px var(--body);color:var(--soft);letter-spacing:0}
nav.secnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
nav.secnav::-webkit-scrollbar{display:none}
nav.secnav a{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:14px;text-decoration:none}
nav.secnav a:hover{border-color:var(--ink)}
nav.secnav a[aria-current="true"]{background:var(--yellow);border-color:var(--ink);color:#1a1a1a}

/* hero */
.hero{position:relative;padding-block:46px 30px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:36px;align-items:start}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hi{display:inline-block;background:var(--mint);color:#1a1a1a;border:var(--stroke);border-radius:999px;padding:6px 16px;font:700 15px var(--display);box-shadow:var(--pop-s);transform:rotate(-2deg)}
.hero h1{font:700 clamp(46px,7.6vw,104px)/.94 var(--display);letter-spacing:-.045em;margin:22px 0 0}
.hero h1 .xmark{width:.62em;height:.62em;vertical-align:.04em;margin-left:.06em}
.hero .ko{font:800 clamp(20px,2.4vw,28px)/1.35 var(--body);margin:18px 0 0;letter-spacing:-.02em}
.hero p.lead{color:var(--soft);font-size:17px;max-width:34em;margin:12px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:var(--stroke);border-radius:14px;padding:11px 18px;background:var(--paper);box-shadow:var(--pop);font-weight:800;text-decoration:none;color:var(--ink);transition:transform .12s, box-shadow .12s}
.btn.y{background:var(--yellow);color:#1a1a1a}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}

/* live timing tower */
.tower{position:relative;background:var(--paper);border:var(--stroke);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:18px 18px 12px;transform:rotate(1.2deg);margin-top:18px}
.tower .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:var(--stroke);padding-bottom:10px;margin-bottom:6px}
.tower .head b{font:700 20px var(--display)}
.tower .head span{font:600 12px var(--mono);color:var(--soft)}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 25%,transparent)}
.trow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:2px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
.trow:last-of-type{border-bottom:0}
.trow .p{font:700 18px var(--display);color:var(--orange)}
.trow .w{font-weight:800;font-size:14.5px;line-height:1.3}
.trow .w small{display:block;font-weight:500;color:var(--soft);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bignum{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.bignum b{font:700 64px/1 var(--display);color:var(--orange);letter-spacing:-.04em}
.bignum span{font-weight:800;font-size:14px;line-height:1.35}
.sticker{position:absolute;z-index:3;border:var(--stroke);box-shadow:var(--pop-s);border-radius:999px;padding:6px 14px;font:700 14px var(--display);white-space:nowrap;color:#1a1a1a}
.sticker.s1{background:var(--cobalt);color:#fff;top:-18px;left:-14px;transform:rotate(-8deg)}
.sticker.s2{background:var(--orange);bottom:-20px;left:18px;transform:rotate(-4deg)}
.sticker.s3{background:var(--mint);width:96px;height:96px;border-radius:50%;display:grid;place-items:center;text-align:center;white-space:normal;line-height:1.1;font-size:13px;right:-22px;bottom:-34px;transform:rotate(12deg)}
@media (max-width:900px){.tower{transform:none}.sticker.s3{right:-6px}}

/* tape */
.tape{position:relative;z-index:2;margin-block:26px 10px;background:var(--yellow);border-block:var(--stroke);transform:rotate(-1.4deg);overflow:hidden;color:#1a1a1a}
.tape-track{display:flex;width:max-content;animation:tape 38s linear infinite;padding-block:12px}
.tape-track span{font:700 19px var(--display);padding:0 24px;white-space:nowrap}
.tape-track span::after{content:"✦";color:var(--orange);margin-left:48px}
@keyframes tape{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tape-track{animation:none}}

/* sections */
section.sec{position:relative;padding-block:84px 10px}
.sec-head{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 40px;align-items:end;margin-bottom:28px}
@media (max-width:900px){.sec-head{grid-template-columns:minmax(0,1fr)}}
.sec-head h2{font:700 clamp(40px,6vw,76px)/.95 var(--display);letter-spacing:-.045em;margin:0}
.sec-head h2 small{display:block;font:800 clamp(17px,1.8vw,21px)/1.3 var(--body);letter-spacing:-.01em;margin-top:12px}
.sec-head p{margin:0;color:var(--soft);font-size:16px}
.ghost{position:absolute;right:0;top:-38px;font:700 clamp(110px,15vw,210px)/1 var(--display);color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--ink) 16%,transparent);pointer-events:none;z-index:-1;letter-spacing:-.05em}

.panel{background:var(--paper);border:var(--stroke);border-radius:20px;box-shadow:var(--pop);padding:24px;min-width:0}
.panel h3{font:800 19px/1.35 var(--body);letter-spacing:-.01em;margin:0}
.panel .sub{color:var(--soft);font-size:14.5px;margin:6px 0 18px}
.tag{display:inline-block;border:var(--stroke);border-radius:10px;padding:2px 10px;font:700 13px var(--display);box-shadow:var(--pop-s);margin-bottom:12px;color:#1a1a1a}
.stack{display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:26px}
.stack > *, .cols > *{min-width:0}

/* road (race track) */
.road{background:var(--paper);border:var(--stroke);border-radius:22px;box-shadow:var(--pop);padding:22px;position:relative}
.road-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}
.legend i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink)}
.road-scroll{overflow-x:auto}
.road svg{display:block;min-width:760px;width:100%}
.road .tip{position:absolute;z-index:6;pointer-events:none;background:var(--paper);border:var(--stroke);border-radius:14px;box-shadow:var(--pop-s);padding:10px 13px;font-size:13.5px;line-height:1.55;max-width:300px}
.road .tip b{display:block;font-size:14.5px}
.road .tip .meta{color:var(--soft);font-size:12.5px}
.road-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.road-foot span{border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:13.5px;background:var(--cream)}
.road-foot b{font-weight:800}

/* findings */
.findings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:30px}
@media (max-width:900px){.findings{grid-template-columns:minmax(0,1fr)}}
.finding{background:var(--paper);border:var(--stroke);border-radius:20px;box-shadow:var(--pop);padding:22px}
.finding:nth-child(1) .tag{background:var(--pink)} .finding:nth-child(2) .tag{background:var(--mint)} .finding:nth-child(3) .tag{background:var(--yellow)}
.finding h3{font:800 20px/1.35 var(--body);letter-spacing:-.02em;margin:0 0 8px}
.finding p{margin:0;color:var(--soft);font-size:15px}

/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px 26px}
.fig b{display:block;font:700 36px/1 var(--display);letter-spacing:-.03em;color:var(--orange)}
.fig b small{font-size:.5em;color:var(--ink);margin-left:4px;letter-spacing:0}
.fig .l{display:block;margin-top:8px;font-weight:800;font-size:14.5px;line-height:1.4}
.fig .n{display:block;font-size:12.5px;color:var(--soft);line-height:1.5}
.fig .src{margin-top:6px}

/* evidence */
.ev{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.tier{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 6px;border-radius:6px;border:2px solid var(--ink);font:700 11px var(--mono);color:#1a1a1a}
.tier.t1{background:var(--mint)} .tier.t2{background:var(--paper);color:var(--ink)} .tier.t3{background:var(--yellow)}
.unv{border-bottom:2px dotted var(--soft)}
.ev a{color:var(--soft);font-weight:700}
.st{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:800;white-space:nowrap;color:#1a1a1a}
.st.met{background:var(--mint)} .st.on-track{background:var(--cobalt);color:#fff} .st.at-risk,.st.stalled{background:var(--yellow)}
.st.missed,.st.dropped{background:var(--orange)} .st.pending{background:var(--paper);color:var(--ink)} .st.superseded{background:var(--pink)}

/* tables */
.tbl{overflow-x:auto;border:var(--stroke);border-radius:16px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:720px}
th,td{text-align:left;padding:12px 14px;border-bottom:2px solid color-mix(in srgb,var(--ink) 14%,transparent);vertical-align:top}
th{font:700 13px var(--display);background:var(--sand);border-bottom:var(--stroke)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--yellow) 14%,transparent)}
td .small{display:block;font-size:12.5px;color:var(--soft);line-height:1.5}
td.r{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* bars */
.bars{display:grid;gap:12px}
.brow{display:grid;grid-template-columns:minmax(110px,32%) minmax(0,1fr);gap:12px;align-items:center;font-size:14.5px}
.brow .lab{min-width:0;line-height:1.35;font-weight:700}
.brow .lab .small{display:block;font-size:12px;font-weight:500;color:var(--soft)}
.trk{position:relative;height:30px;border:2px solid var(--ink);border-radius:9px;background:var(--cream);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;background:var(--orange);border-right:2px solid var(--ink);min-width:4px}
.fill.b{background:var(--cobalt)} .fill.y{background:var(--yellow)}
.trk .v{position:absolute;left:10px;top:50%;transform:translateY(-50%);font:700 13px var(--mono);color:#1a1a1a;background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:0 6px;white-space:nowrap}

/* roster */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chips button{font:inherit;font-size:14px;font-weight:800;padding:6px 14px;border-radius:999px;border:var(--stroke);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:var(--pop-s)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.who{background:var(--paper);border:var(--stroke);border-radius:18px;box-shadow:var(--pop);padding:18px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .12s, box-shadow .12s}
.who:hover{transform:translate(-2px,-2px) rotate(-.6deg);box-shadow:7px 7px 0 var(--ink)}
.who .nm{font:700 21px/1.15 var(--display);letter-spacing:-.02em}
.who .kd{font:600 12px var(--mono);color:var(--soft)}
.who .th{font-size:13.5px;color:var(--soft);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pbar{display:flex;height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--cream);margin-top:auto}
.pbar span{display:block;height:100%}
dialog{border:var(--stroke);border-radius:24px;padding:0;max-width:min(880px,calc(100vw - 32px));width:100%;background:var(--paper);color:var(--ink);box-shadow:10px 10px 0 var(--ink)}
dialog::backdrop{background:rgba(26,26,26,.55)}
.dlg{padding:28px;display:grid;gap:20px;max-height:min(84vh,900px);overflow:auto}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg-head h3{font:700 38px/1 var(--display);letter-spacing:-.03em;margin:4px 0 0}
.x{font:inherit;font-weight:800;border:var(--stroke);background:var(--yellow);color:#1a1a1a;border-radius:12px;padding:6px 14px;cursor:pointer;box-shadow:var(--pop-s)}
ul.sign{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.sign li{padding-left:24px;position:relative;font-size:15px}
ul.sign li::before{content:"✦";position:absolute;left:0;top:0;color:var(--orange);font-weight:900}
ul.sign.red li::before{content:"✕";color:var(--orange)}
ul.sign.green li::before{content:"✓";color:#11865b}

/* timeline */
.tl{display:grid}
.tl .it{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:2px dashed color-mix(in srgb,var(--ink) 20%,transparent);font-size:14.5px}
.tl .it:last-child{border-bottom:0}
.tl time{font:600 12.5px var(--mono);padding-top:3px}
.tl .w{font-weight:800;margin-right:6px}

/* calculators */
.calc{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:30px}
@media (max-width:860px){.calc{grid-template-columns:minmax(0,1fr)}}
.sl{display:grid;gap:4px;padding:11px 0;border-bottom:2px dashed color-mix(in srgb,var(--ink) 18%,transparent)}
.sl:last-child{border-bottom:0}
.sl .top{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:700}
.sl output{font:700 14px var(--mono);background:var(--yellow);color:#1a1a1a;border:2px solid var(--ink);border-radius:7px;padding:0 7px}
.sl small{font-size:12px;color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--orange)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.presets button{font:inherit;font-size:13px;font-weight:800;padding:5px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.result{background:var(--cream);border:var(--stroke);border-radius:18px;padding:20px}
.big{font:700 64px/1 var(--display);letter-spacing:-.04em;color:var(--orange)}
.big small{display:block;font:800 15px var(--body);color:var(--ink);letter-spacing:0;margin-top:6px}
.callout{border:var(--stroke);border-radius:16px;background:var(--yellow);color:#1a1a1a;padding:14px 18px;font-size:14.5px;font-weight:600;box-shadow:var(--pop-s)}

/* regulation */
.gate{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:10px;min-width:780px}
.gate .h{font:700 14px var(--display);padding:4px}
.gate .rn{font:700 22px/1.1 var(--display);padding:12px 4px;letter-spacing:-.02em}
.cell{border:var(--stroke);border-radius:14px;padding:12px;font-size:13.5px;line-height:1.55;background:var(--paper)}
.cell .sl2{display:inline-block;font-weight:800;font-size:12.5px;border:2px solid var(--ink);border-radius:999px;padding:0 9px;margin-bottom:6px;color:#1a1a1a}
.g-open .sl2{background:var(--mint)} .g-open-limited .sl2{background:#b8c6ff} .g-pilot .sl2{background:var(--paper);color:var(--ink)} .g-pending .sl2{background:var(--yellow)} .g-closed .sl2{background:var(--orange)}
.cell .hold{display:block;margin-top:6px;font-size:12.5px;color:var(--soft);font-weight:700}

/* startups */
.stage{display:inline-flex;align-items:center;gap:3px}
.stage i{width:14px;height:8px;border-radius:3px;border:2px solid var(--ink);background:var(--paper)}
.stage i.on{background:var(--orange)}
.stage em{font-style:normal;font-size:12.5px;font-weight:700;margin-left:6px;white-space:nowrap}
